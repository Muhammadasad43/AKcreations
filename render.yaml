services:
  - type: web
    name: ak-creations
    runtime: docker
    plan: free
    envVars:
      # website
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: POLLINATIONS_MODEL
        value: deepseek
      - key: CLOUDINARY_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DEVELOPER_EMAIL
        sync: false
      - key: CRON_SECRET
        generateValue: true
      # whatsapp bot (same service)
      - key: WA_AGENT_TOKEN
        sync: false
      - key: WA_AGENT_TOKEN_2
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: CEREBRAS_API_KEY
        sync: false
      - key: CEREBRAS_MODEL
        value: gpt-oss-120b
      - key: CEREBRAS_MODEL_2
        value: zai-glm-4.7
